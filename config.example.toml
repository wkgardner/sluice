# sluice configuration.
#
# Section headers group keys for reading only — sluice ignores them, so a
# key works wherever you put it. Every key's own name is what matters.
#
# Regenerated by `sluice setup`: your values are kept, these comments are
# rewritten. Real infrastructure values live here and nowhere else.

[sluice_state]

# The SQLite database holding all run state. sluice's source of truth.
state_file = "~/.sluice/state/sluice_state.db"

# The rotating structured event log (one JSON object per line).
events_file = "~/.sluice/logs/events.jsonl"

# Per-run event logs, one file per run — the fastest way to read one run's
# history.
run_events_dir = "~/.sluice/logs/runs"

# Rotate the event log once it reaches this many megabytes.
events_max_mb = 50

# How many rotated event logs to keep.
events_backup_count = 10

# How long the daemon sleeps between looks. Also the worst-case delay before
# an operator command takes effect.
poll_interval_minutes = 10

[detection]

# Local directory scanned for new runs. Used only in local-source mode.
# Optional — leave empty to switch it off.
watch_dir = "<watch_dir>"

# SSH user on the sequencing server.
remote_user = "<remote_user>"

# Hostname of the sequencing server.
remote_host = "<remote_host>"

# Path on the sequencing server holding run directories. MUST END WITH A
# SLASH, and must point at the folder CONTAINING the run directories, not at a
# run or a delivery inside one. Relative paths are relative to the SSH user's
# home.
remote_source_path = "<remote_source_path>"

# File containing the SSH password. Never stored in config itself.
password_file = "~/.sluice/secrets/remote_password"

# Local directory to transfer FROM instead of over SSH. Set this to rehearse
# the whole pipeline with no credentials at all; leave empty for normal
# operation.
# Optional — leave empty to switch it off.
local_source_dir = "<local_source_dir>"

[storage]

# Where run data is staged, keyed by experiment id. Usually the shared CephFS
# tree — large, and NOT where NVD launches from.
local_staging_dir = "<local_staging_dir>"

# Directory the CephFS quota is set on. Read for free space before a download
# starts.
disk_quota_root = "<disk_quota_root>"

# Require this many times a run's size free before downloading it.
disk_headroom_multiplier = 2

[download]

# Maximum simultaneous file transfers.
parallel_downloads = 4

# How many transfers to add at a time while ramping up.
download_wave_size = 4

# Pause between ramp waves, to avoid tripping the server's connection limit.
download_ramp_delay_seconds = 2

[labkey]

# LabKey server hostname.
labkey_server = "<labkey_server>"

# LabKey project path that experiments are created under.
labkey_experiments_project = "<labkey_experiments_project>"

# LabKey schema holding the experiments list.
labkey_schema = "lists"

# LabKey query (list) name for experiments.
labkey_query = "<labkey_query>"

# File containing the LabKey API key. Never stored in config itself.
labkey_api_key_file = "~/.sluice/secrets/labkey_api_key"

[nvd]

# The NVD repository checkout. Its pyproject.toml pins the tool version sluice
# runs, so keeping this on the intended ref is a deployment step.
nvd_repo_dir = "<nvd_repo_dir>"

# The nvd executable name inside that environment.
nvd_command = "nvd"

# Where Nextflow launches from. MUST be local disk, never the shared staging
# tree — on shared storage --resume silently does nothing and an interrupted
# run restarts from zero (errata D2).
nvd_launch_base = "~/.sluice/nvd-launch"

# Per-experiment NVD pipeline logs, appended across retries.
nvd_log_dir = "~/.sluice/logs/nvd"

# Base directory for NVD results and work trees. Large.
nvd_results_base = "<nvd_results_base>"

# Nextflow profile to run under, if any. Leave empty for the default.
# Optional — leave empty to switch it off.
nvd_profile = "<nvd_profile>"

[nvd_reference_data]

# Directory holding the BLAST database.
nvd_blast_db = "<nvd_blast_db>"

# BLAST database file prefix.
nvd_blast_db_prefix = "<nvd_blast_db_prefix>"

# BLAST database version, recorded in results for provenance.
nvd_blast_db_version = "<nvd_blast_db_version>"

# Directory holding the NCBI taxonomy dump.
nvd_taxonomy_dir = "<nvd_taxonomy_dir>"

# The virus index file.
nvd_virus_index = "<nvd_virus_index>"

# Virus index version, recorded in results for provenance.
nvd_virus_index_version = "<nvd_virus_index_version>"

[nvd_analysis]

# Abundance cutoff below which hits are discarded.
nvd_cutoff_percent = 0.001

# Entropy filter threshold.
nvd_entropy = 0.9

# Taxonomic assignment stringency.
nvd_tax_stringency = 0.7

# Maximum BLAST targets per query.
nvd_max_blast_targets = 100

# Whether to deduplicate reads.
nvd_dedup = true

# Whether to trim sequencing adapters before analysis.
nvd_trim_adapters = true

[nvd_labkey_upload]

# Whether NVD uploads its results to LabKey at all.
nvd_labkey = true

# LabKey server NVD uploads results to. Usually the same host as
# labkey_server, but kept separate so results can be sent elsewhere.
nvd_labkey_server = "<nvd_labkey_server>"

# LabKey project path holding the hit lists NVD writes into.
nvd_labkey_project_name = "<nvd_labkey_project_name>"

# LabKey schema holding the hit lists.
nvd_labkey_schema = "lists"

# LabKey list receiving the per-hit FASTA records.
nvd_labkey_blast_fasta_list = "<nvd_labkey_blast_fasta_list>"

# LabKey list receiving the expanded metagenomic BLAST hits.
nvd_labkey_blast_meta_hits_list = "<nvd_labkey_blast_meta_hits_list>"

# LabKey list NVD uses to make its own upload idempotent — as load-bearing as
# the two hit lists, and as easy to point at the wrong container.
nvd_labkey_exp_id_guard_list = "<nvd_labkey_exp_id_guard_list>"

[slack]

# Whether to post run notifications to Slack.
slack_enabled = false

# Channel id to post into.
# Optional — leave empty to switch it off.
slack_channel = "<slack_channel>"

# File containing the Slack bot token. Never stored in config itself.
# Optional — leave empty to switch it off.
slack_bot_token_file = "~/.sluice/secrets/slack_bot_token"

# File listing Slack user ids to @-mention when a run needs a human, one per
# line.
# Optional — leave empty to switch it off.
slack_user_id_file = "~/.sluice/secrets/slack_mentions"
